<!DOCTYPE html>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Montserrat', sans-serif; background: #faf8f5; color: #1a1a1a; line-height: 1.6; }
        .container { max-width: 700px; margin: 0 auto; padding: 20px; }

            color: #1a1a1a; transition: 0.3s; border-bottom: 4px solid #fdf0f2;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .category-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(197, 0, 43, 0.12); border-bottom-color: #c5002b; }
        .category-card .icon { font-size: 2.2em; display: block; margin-bottom: 10px; }
        .category-card .name { font-weight: 700; font-size: 0.95em; margin-bottom: 4px; }
        .category-card .desc { font-size: 0.75em; color: #777; }
    </style>
</head>
